services:
  gateway:
    image: nginx:alpine
    container_name: tigerdb-gateway
    ports:
      - "80:80"
      - "5173:5173"
      - "4001:4001"
      - "5672:5672"
      - "7474:7474"
      - "7687:7687"
      - "8000:8000"
      - "8080:8080"
      - "8085:8443"
      - "9000:9000"
      - "9001:9001"
      - "9090:9090"
      - "15672:15672"
    networks:
      default:
        aliases:
          - localhost
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ui
      - minio
      - rabbitmq
      - neo4j
      - keycloak
      - funnel
  api:
    build:
      context: ./api
    container_name: tigerdb-api
    ports:
      - "9229:9229"
    networks:
      default:
        aliases:
          - api.local
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=letmeinpls
      - RABBITMQ_HOST=tigerdb-rabbitmq
      - RABBITMQ_PORT=5672
      - KEYCLOAK_JWKS_URL=http://keycloak:8080/realms/tigerdb/protocol/openid-connect/certs
      - MINIO_ENDPOINT=tigerdb-minio
      - MINIO_PORT=9000
      - MINIO_PRESIGN_ENDPOINT=localhost
    volumes:
      - ./api:/app
      - /app/node_modules
  ui:
    build:
      context: ./
      dockerfile: ./ui/Dockerfile
    container_name: tigerdb-ui
    environment:
      - CI=true
    volumes:
      - ./ui:/app/ui
      - /app/ui/node_modules
  worker:
    build:
      context: ./nextflow-worker
    ports:
      - "9230:9229"
    container_name: tigerdb-worker
    networks:
      default:
        aliases:
          - worker.local
    volumes:
      - ./nextflow-worker:/work
      - /work/node_modules
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/letmeinpls
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_PLUGINS=["apoc", "apoc-extended", "graph-data-science"]
      - APOC_EXTENDED_VERSION=2026.02.2
    volumes:
      - ./neo4j/plugins:/var/lib/neo4j/plugins
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/data:/var/lib/neo4j/data
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: start-dev
    volumes:
      - tigerdb_keycloak:/opt/keycloak/data
  minio:
    image: minio/minio:latest
    container_name: tigerdb-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: tigerdb-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
  funnel:
    build:
      context: ./funnel
    container_name: tigerdb-funnel
    privileged: true
    entrypoint: "funnel server run --Server.HTTPPort 8000 --Server.RPCPort 9090 --config /opt/funnel/funnel-config.yml"
    environment:
      - S3_FORCE_PATH_STYLE=true
    volumes:
      - ./funnel/funnel-config.yml:/opt/funnel/funnel-config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/funnel-work:/tmp/funnel-work

volumes:
  tigerdb_keycloak:
  rabbitmq_data:
  rabbitmq_logs: