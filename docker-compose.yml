services:
  gateway:
    image: nginx:alpine
    container_name: tigerdb-gateway
    ports:
      - "80:80"
      - "5173:5173"
      - "4001:4001"
      - "5672:5672"
      - "7070:7070"
      - "7474:7474"
      - "7687:7687"
      - "8000:8000"
      - "8080:8080"
      - "8085:8443"
      - "9090:9090"
      - "15672:15672"
    networks:
      default:
        aliases:
          - localhost
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ui
      - s3
      - rabbitmq
      - neo4j
      - keycloak
      - funnel
  api:
    build:
      context: ./api
    container_name: tigerdb-api
    ports:
      - "9229:9229"
    networks:
      default:
        aliases:
          - api.local
    env_file:
      - .env
      - api/.env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - KEYCLOAK_JWKS_URL=http://keycloak:8080/realms/tigerdb/protocol/openid-connect/certs
      - S3_ENDPOINT=http://s3:7070
      - S3_PRESIGN_ENDPOINT=http://localhost:7070
      - S3_INTERNAL_PRESIGN_ENDPOINT=http://gateway:7070
    volumes:
      - ./api:/app
      - /app/node_modules
  ui:
    build:
      context: ./
      dockerfile: ./ui/Dockerfile
    container_name: tigerdb-ui
    environment:
      - CI=true
    volumes:
      - ./ui:/app/ui
      - /app/ui/node_modules
  worker:
    build:
      context: worker
    ports:
      - "9230:9229"
    container_name: tigerdb-worker
    networks:
      default:
        aliases:
          - worker.local
    env_file:
      - .env
      - worker/.env
    environment:
      - RABBITMQ_HOST=tigerdb-rabbitmq
      - RABBITMQ_PORT=5672
      - FUNNEL_ADDRESS=http://tigerdb-funnel:8000
      - S3_ENDPOINT=http://versitygw:7070
    volumes:
      - ./worker:/work
      - /work/node_modules
  neo4j:
    image: neo4j:2026.09
    container_name: tigerdb-neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_PLUGINS=["apoc", "apoc-extended", "graph-data-science"]
      - APOC_EXTENDED_VERSION=2026.02.2
    volumes:
      - ./neo4j/plugins:/var/lib/neo4j/plugins
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/data:/var/lib/neo4j/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: keycloak
    env_file:
      - .env
    command: start-dev
    volumes:
      - tigerdb_keycloak:/opt/keycloak/data
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: tigerdb-rabbitmq
    env_file:
      - .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
  funnel:
    build:
      context: ./funnel
    container_name: tigerdb-funnel
    privileged: true
    entrypoint: "funnel server run --Server.HTTPPort 8000 --Server.RPCPort 9090 --config /opt/funnel/funnel-config.yml"
    environment:
      - S3_FORCE_PATH_STYLE=true
    volumes:
      - ./funnel/funnel-config.yml:/opt/funnel/funnel-config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/funnel-work:/tmp/funnel-work
  s3:
    image: ghcr.io/versity/versitygw:v1.8.0
    container_name: tigerdb-s3
    ports:
      - "7071:7071"
      - "8081:8080"
    env_file:
      - .env
    environment:
      VGW_PORT: ":7070"
      VGW_IAM_DIR: /data/iam
      VGW_VERSIONING_DIR: /data/versioning
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/s3
      VGW_ADMIN_PORT: ":7071"
      VGW_WEBUI_PORT: ":8080"
      VGW_META_SIDECAR: /data/.sidecar
      VGW_CORS_ALLOW_ORIGIN: "*"
      VGW_WEBUI_GATEWAYS: "http://localhost:7070"
      VGW_WEBUI_ADMIN_GATEWAYS: "http://localhost:7071"
    volumes:
      - ./versitygw/data/s3:/data/s3
      - ./versitygw/data/versioning:/data/versioning
      - ./versitygw/data/iam:/data/iam
      - ./versitygw/data/.sidecar:/data/.sidecar

volumes:
  tigerdb_keycloak:
  rabbitmq_data:
  rabbitmq_logs: