events {
    worker_connections 1024;
}

stream {
    # Neo4j Bolt Protocol (TCP)
    server {
        listen 7687;
        proxy_pass neo4j:7687;
    }
    # RabbitMQ AMQP (TCP)
    server {
        listen 5672;
        proxy_pass tigerdb-rabbitmq:5672;
    }
    # Funnel RPC (TCP)
    server {
        listen 9090;
        proxy_pass tigerdb-funnel:9090;
    }
    # API GraphQL HTTPS Pass-through
    server {
        listen 4001;
        proxy_pass tigerdb-api:4001;
    }
}

http {
    # Provide HMR (Hot Module Replacement) mapping for WebSockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ------------------------------------
    # UI ROUTING (Port 80 -> UI Container)
    # ------------------------------------
    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://tigerdb-ui:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Critical for Vite HMR (Live reload)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # ------------------------------------
    # MINIO ROUTING (Port 9000 & 9001)
    # ------------------------------------
    server {
        listen 9000;
        location / {
            proxy_pass http://tigerdb-minio:9000;
            proxy_set_header Host "localhost:9000";
            client_max_body_size 0;
        }
    }

    server {
        listen 9001;
        location / {
            proxy_pass http://tigerdb-minio:9001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # ------------------------------------
    # VITE HMR WEBSOCKET (Port 5173)
    # ------------------------------------
    server {
        listen 5173;
        location / {
            proxy_pass http://tigerdb-ui:5173;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # ------------------------------------
    # NEO4J BROWSER/HTTP (Port 7474)
    # ------------------------------------
    server {
        listen 7474;
        location / {
            proxy_pass http://neo4j:7474;
            proxy_set_header Host $http_host;
        }
    }

    # ------------------------------------
    # RABBITMQ MANAGEMENT UI (Port 15672)
    # ------------------------------------
    server {
        listen 15672;
        location / {
            proxy_pass http://tigerdb-rabbitmq:15672;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # ------------------------------------
    # KEYCLOAK SECURE AUTH (Port 8080)
    # ------------------------------------
    server {
        listen 8080;
        location / {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ------------------------------------
    # FUNNEL HTTP API (Port 8000)
    # ------------------------------------
    server {
        listen 8000;
        location / {
            proxy_pass http://tigerdb-funnel:8000;
            proxy_set_header Host $http_host;
        }
    }
}