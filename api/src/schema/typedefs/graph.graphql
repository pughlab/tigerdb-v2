type TCR @node(labels: ["GliphTCR"]) {
  id: ID! @id
  cdr3b: String!
  v_gene: String
  j_gene: String
  sample: String
  source: String
}

type GraphNode {
  id: ID!
  group: String!
  value: String
  label: String
  v_gene: String
  j_gene: String
  size: Int
  color: String
  source: String
  hla_a: String
  hla_b: String
  hla_c: String
  hla_dpa1: String
  hla_dpb1: String
  hla_dqa1: String
  hla_dqb1: String
  hla_drb1: String
  hla_drb3: String
  hla_drb4: String
  hla_drb5: String
}

type NodeDetails {
  cdr3b: String!
  v_gene: String
  j_gene: String
  source: String
  projectID: String
  projectName: String
  datasetID: String
  datasetName: String
  variableID: String
  trav: String
  traj: String
  mhc: String
  mhcClass: String
  epitopeGene: String
  epitopeAAseq: String
  epitopeSpecies: String
  mutation: String
  recognizesWTEpitope: String
  uniProt: String
  reference: String
}

type GraphLink {
  source: ID!
  target: ID!
}

type Graph {
  nodes: [GraphNode!]!
  links: [GraphLink!]!
}

input GraphOptions {
  minCommunitySize: Int
  cdr3bContains: String
  maxNodes: Int
}

input GraphInput {
  runId: ID!
  presignedURL: String!
}

extend type Query {
  graph(runId: ID!, options: GraphOptions): Graph
  node(cdr3b: String!): NodeDetails
}

extend type Mutation {
  importResults(input: GraphInput!): Boolean
}
