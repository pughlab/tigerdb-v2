type GraphNode {
  id: ID!
  group: String!
  sample: String
  value: String
  pattern: String
  source: String
  score: Float
  size: Int
  color: String
  v_gene: String
  j_gene: String
}

type GraphLink {
  source: ID!
  target: ID!
}

type Graph {
  nodes: [GraphNode!]!
  links: [GraphLink!]!
}

input GraphInput {
  runId: ID!
  presignedURL: String!
}

extend type Query {
  graph(runId: ID!): Graph
}

extend type Mutation {
  importResults(input: GraphInput!): Boolean
}
